<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Scheme-aware favicon: the Choreo Labs mark on its own, the compact form
         of the header lockup, in Midnight Ink or white. A favicon slot is ~16px
         and square, so it takes the mark without the wordmark.

         Dark is declared first deliberately: a browser that ignores `media` on
         an icon link generally takes the last one, and the navy mark is the
         safer default against a light tab strip. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-mark-white.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-mark-navy.svg"
      media="(prefers-color-scheme: light)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One App</title>
    <!-- Covers the moment before the two scripts below have downloaded, when the
         browser would otherwise paint its default white: the default theme's
         dark background, since dark is the default mode. The CSP allows inline
         styles; color-scheme-init.js then refines it to the saved mode and
         theme. -->
    <style>
      html {
        background-color: #050a1c;
      }
    </style>
    <!-- Runtime config injected at deploy time. See public/config.js.example. -->
    <script src="/config.js"></script>
    <!-- Paints the theme's background before the bundle loads, so dark mode
         doesn't flash white on every full load. After config.js: it reads
         ONE_WSO2_THEME. A file rather than inline: the CSP blocks inline
         scripts. See public/color-scheme-init.js. -->
    <script src="/color-scheme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
